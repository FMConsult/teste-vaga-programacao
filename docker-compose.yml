# Typebot — stack para Portainer
# Docs: https://docs.typebot.com/self-hosting/deploy/docker
#
# Como usar no Portainer:
# 1. Stacks → Add stack → nome: typebot
# 2. Cole este docker-compose.yml no Web editor
# 3. Em "Environment variables", adicione as variáveis do arquivo .env.example
# 4. Deploy the stack
#
# URLs padrão após o deploy:
#   Builder: http://SEU_IP:8080
#   Viewer:  http://SEU_IP:8081
#
# Em produção, coloque um reverse proxy (Traefik/Nginx/Caddy) na frente
# e use HTTPS nas variáveis NEXTAUTH_URL e NEXT_PUBLIC_VIEWER_URL.

services:
  typebot-db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: typebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-typebot}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - typebot_network

  typebot-redis:
    image: redis:alpine
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - redis-data:/data
    networks:
      - typebot_network

  typebot-builder:
    image: baptistearno/typebot-builder:${TYPEBOT_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      typebot-db:
        condition: service_healthy
      typebot-redis:
        condition: service_healthy
    ports:
      - "${BUILDER_PORT:-8080}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:typebot@typebot-db:5432/typebot}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_VIEWER_URL: ${NEXT_PUBLIC_VIEWER_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      DEFAULT_WORKSPACE_PLAN: ${DEFAULT_WORKSPACE_PLAN:-UNLIMITED}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      NODE_OPTIONS: "--no-node-snapshot"
      REDIS_URL: redis://typebot-redis:6379
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      NEXT_PUBLIC_SMTP_FROM: ${NEXT_PUBLIC_SMTP_FROM:-}
      GOOGLE_AUTH_CLIENT_ID: ${GOOGLE_AUTH_CLIENT_ID:-}
      GOOGLE_AUTH_CLIENT_SECRET: ${GOOGLE_AUTH_CLIENT_SECRET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-typebot}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PORT: ${S3_PORT:-443}
      S3_SSL: ${S3_SSL:-true}
    networks:
      - typebot_network
    # Traefik (opcional) — descomente e ajuste o domínio:
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.typebot-builder.rule=Host(`typebot.seudominio.com`)
    #   - traefik.http.routers.typebot-builder.entrypoints=websecure
    #   - traefik.http.routers.typebot-builder.tls.certresolver=letsencrypt
    #   - traefik.http.services.typebot-builder.loadbalancer.server.port=3000

  typebot-viewer:
    image: baptistearno/typebot-viewer:${TYPEBOT_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      typebot-db:
        condition: service_healthy
      typebot-redis:
        condition: service_healthy
    ports:
      - "${VIEWER_PORT:-8081}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:typebot@typebot-db:5432/typebot}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_VIEWER_URL: ${NEXT_PUBLIC_VIEWER_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      DEFAULT_WORKSPACE_PLAN: ${DEFAULT_WORKSPACE_PLAN:-UNLIMITED}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      NODE_OPTIONS: "--no-node-snapshot"
      REDIS_URL: redis://typebot-redis:6379
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      NEXT_PUBLIC_SMTP_FROM: ${NEXT_PUBLIC_SMTP_FROM:-}
      GOOGLE_AUTH_CLIENT_ID: ${GOOGLE_AUTH_CLIENT_ID:-}
      GOOGLE_AUTH_CLIENT_SECRET: ${GOOGLE_AUTH_CLIENT_SECRET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-typebot}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PORT: ${S3_PORT:-443}
      S3_SSL: ${S3_SSL:-true}
    networks:
      - typebot_network
    # Traefik (opcional) — descomente e ajuste o domínio:
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.typebot-viewer.rule=Host(`bot.seudominio.com`)
    #   - traefik.http.routers.typebot-viewer.entrypoints=websecure
    #   - traefik.http.routers.typebot-viewer.tls.certresolver=letsencrypt
    #   - traefik.http.services.typebot-viewer.loadbalancer.server.port=3000

# Rede attachable evita falha de DNS ao migrar stacks no Portainer
# https://docs.typebot.com/self-hosting/deploy/docker#avoiding-network-issues-when-migrating-in-portainer
networks:
  typebot_network:
    driver: bridge
    attachable: true

volumes:
  db-data:
  redis-data:
